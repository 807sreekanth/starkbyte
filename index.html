<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StarkByte Solutions – Web & App Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#e0000f;
  --red2:#ff2233;
  --silver:#c8d0d8;
  --silver2:#e8edf2;
  --dark:#0a0a0c;
  --dark2:#111116;
  --dark3:#181820;
  --dark4:#1e1e28;
  --accent:#ff3344;
  --glow:0 0 20px rgba(224,0,15,0.5);
  --font-head:'Exo 2',sans-serif;
  --font-body:'Rajdhani',sans-serif;
  --font-mono:'Share Tech Mono',monospace;
}
html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--silver2);font-family:var(--font-body);overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--dark2);}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px;}

/* GLOBAL ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(224,0,15,0.3)}50%{box-shadow:0 0 30px rgba(224,0,15,0.8),0 0 60px rgba(224,0,15,0.3)}}
@keyframes lineGrow{from{width:0}to{width:100%}}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-12px)}}
@keyframes scanline{0%{top:-10%}100%{top:110%}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes particleFloat{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}
@keyframes borderRun{0%{background-position:0% 0%}100%{background-position:200% 0%}}
@keyframes countUp{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
@keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(60px)}}
@keyframes neonFlicker{0%,19%,21%,23%,25%,54%,56%,100%{text-shadow:0 0 10px var(--red),0 0 20px var(--red),0 0 40px var(--red)}20%,24%,55%{text-shadow:none}}
@keyframes morphBorder{0%,100%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40% / 50% 60% 30% 60%}}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 40px;height:70px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,12,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(224,0,15,0.2);}
.navbar.scrolled{border-bottom-color:rgba(224,0,15,0.5);box-shadow:0 4px 30px rgba(0,0,0,0.5);}
.nav-logo{display:flex;align-items:center;gap:12px;cursor:pointer;}
.nav-logo img{height:44px;width:44px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(224,0,15,0.6));}
.nav-logo-text{font-family:var(--font-head);font-weight:800;font-size:1.3rem;letter-spacing:2px;}
.nav-logo-text span:first-child{color:var(--silver2);}
.nav-logo-text span:last-child{color:var(--red);}
.nav-links{display:flex;align-items:center;gap:8px;}
.nav-link{background:none;border:none;color:var(--silver);font-family:var(--font-body);font-size:0.95rem;font-weight:600;letter-spacing:1px;padding:8px 16px;cursor:pointer;position:relative;text-transform:uppercase;transition:color 0.3s;}
.nav-link::after{content:'';position:absolute;bottom:0;left:50%;right:50%;height:2px;background:var(--red);transition:left 0.3s,right 0.3s;}
.nav-link:hover,.nav-link.active{color:white;}
.nav-link:hover::after,.nav-link.active::after{left:16px;right:16px;}
.nav-cta{background:linear-gradient(135deg,var(--red),#aa0010);border:none;color:white;font-family:var(--font-body);font-weight:700;font-size:0.9rem;letter-spacing:1px;padding:10px 22px;cursor:pointer;text-transform:uppercase;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all 0.3s;position:relative;overflow:hidden;}
.nav-cta::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.4s;}
.nav-cta:hover{box-shadow:var(--glow);}
.nav-cta:hover::before{left:100%;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:5px;}
.hamburger span{width:24px;height:2px;background:var(--silver2);transition:all 0.3s;}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:100px 40px 60px;}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(224,0,15,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(224,0,15,0.05) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 4s linear infinite;}
.hero-grid::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,var(--dark) 80%);}
.hero-particles{position:absolute;inset:0;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:var(--red);border-radius:50%;animation:particleFloat linear infinite;}
.hero-content{position:relative;z-index:2;max-width:700px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(224,0,15,0.1);border:1px solid rgba(224,0,15,0.3);padding:6px 16px;font-family:var(--font-mono);font-size:0.8rem;color:var(--red);letter-spacing:2px;margin-bottom:24px;animation:fadeUp 0.8s ease both;}
.hero-badge::before{content:'';width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 1.5s ease infinite;}
.hero-title{font-family:var(--font-head);font-weight:800;font-size:clamp(2.5rem,6vw,5rem);line-height:1.05;margin-bottom:20px;animation:fadeUp 0.8s 0.2s ease both;}
.hero-title .line1{color:var(--silver2);}
.hero-title .line2{color:var(--red);display:block;animation:neonFlicker 3s 2s infinite;}
.hero-subtitle{font-size:1.1rem;color:var(--silver);line-height:1.7;margin-bottom:36px;animation:fadeUp 0.8s 0.4s ease both;max-width:560px;}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;animation:fadeUp 0.8s 0.6s ease both;}
.btn-primary{background:linear-gradient(135deg,var(--red),#aa0010);border:none;color:white;font-family:var(--font-body);font-weight:700;font-size:1rem;letter-spacing:1px;padding:14px 32px;cursor:pointer;text-transform:uppercase;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);transition:all 0.3s;position:relative;overflow:hidden;}
.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transition:left 0.5s;}
.btn-primary:hover{box-shadow:0 0 30px rgba(224,0,15,0.6);transform:translateY(-2px);}
.btn-primary:hover::before{left:100%;}
.btn-outline{background:transparent;border:2px solid rgba(224,0,15,0.5);color:var(--silver2);font-family:var(--font-body);font-weight:700;font-size:1rem;letter-spacing:1px;padding:12px 32px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;}
.btn-outline:hover{border-color:var(--red);color:white;background:rgba(224,0,15,0.1);box-shadow:0 0 20px rgba(224,0,15,0.2);}
.hero-stats{display:flex;gap:40px;margin-top:60px;animation:fadeUp 0.8s 0.8s ease both;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-num{font-family:var(--font-head);font-size:2.2rem;font-weight:800;color:var(--red);line-height:1;}
.stat-label{font-size:0.8rem;color:var(--silver);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.hero-visual{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:420px;height:420px;display:flex;align-items:center;justify-content:center;animation:float 4s ease-in-out infinite;}
.hero-ring{position:absolute;border:1px solid rgba(224,0,15,0.2);border-radius:50%;}
.hero-ring:nth-child(1){width:300px;height:300px;animation:spin 20s linear infinite;}
.hero-ring:nth-child(2){width:380px;height:380px;animation:spin 30s linear infinite reverse;}
.hero-ring:nth-child(3){width:420px;height:420px;border-style:dashed;animation:spin 15s linear infinite;}
.hero-logo{width:180px;height:180px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 0 30px rgba(224,0,15,0.7));}
.scanline{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(224,0,15,0.6),transparent);animation:scanline 3s linear infinite;pointer-events:none;}

/* SECTIONS */
section{padding:100px 40px;}
.section-header{text-align:center;margin-bottom:70px;}
.section-tag{font-family:var(--font-mono);font-size:0.8rem;color:var(--red);letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:12px;}
.section-title{font-family:var(--font-head);font-weight:800;font-size:clamp(2rem,4vw,3rem);color:var(--silver2);line-height:1.1;}
.section-title span{color:var(--red);}
.section-line{width:60px;height:3px;background:linear-gradient(90deg,var(--red),transparent);margin:20px auto 0;position:relative;}
.section-line::before{content:'';position:absolute;top:50%;left:0;transform:translateY(-50%);width:100%;height:3px;background:var(--red);animation:lineGrow 1s ease both;}

/* SERVICES */
.services{background:var(--dark2);}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1200px;margin:0 auto;}
.service-card{background:var(--dark3);border:1px solid rgba(224,0,15,0.1);padding:36px 28px;position:relative;overflow:hidden;cursor:pointer;transition:all 0.4s;group:true;}
.service-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(224,0,15,0.05),transparent);opacity:0;transition:opacity 0.4s;}
.service-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:scaleX(0);transition:transform 0.4s;}
.service-card:hover{border-color:rgba(224,0,15,0.4);transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,0.4),0 0 30px rgba(224,0,15,0.1);}
.service-card:hover::before{opacity:1;}
.service-card:hover::after{transform:scaleX(1);}
.service-icon{font-size:2.5rem;margin-bottom:20px;display:block;filter:grayscale(0);}
.service-name{font-family:var(--font-head);font-weight:700;font-size:1.25rem;color:var(--silver2);margin-bottom:12px;letter-spacing:1px;}
.service-desc{font-size:0.95rem;color:var(--silver);line-height:1.7;}
.service-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;}
.service-tag{font-family:var(--font-mono);font-size:0.7rem;color:var(--red);background:rgba(224,0,15,0.08);border:1px solid rgba(224,0,15,0.2);padding:3px 10px;letter-spacing:1px;}
.service-arrow{position:absolute;bottom:20px;right:20px;color:var(--red);opacity:0;transition:all 0.3s;font-size:1.2rem;}
.service-card:hover .service-arrow{opacity:1;transform:translate(4px,-4px);}

/* TECH STACK */
.tech-section{background:var(--dark);}
.tech-track{overflow:hidden;position:relative;margin-bottom:16px;}
.tech-track::before,.tech-track::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:2;}
.tech-track::before{left:0;background:linear-gradient(90deg,var(--dark),transparent);}
.tech-track::after{right:0;background:linear-gradient(-90deg,var(--dark),transparent);}
.tech-scroll{display:flex;gap:16px;width:max-content;}
.tech-scroll.scroll-left{animation:scrollLeft 25s linear infinite;}
.tech-scroll.scroll-right{animation:scrollRight 20s linear infinite;}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scrollRight{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
.tech-pill{background:var(--dark3);border:1px solid rgba(224,0,15,0.15);padding:12px 24px;font-family:var(--font-mono);font-size:0.85rem;color:var(--silver);white-space:nowrap;transition:all 0.3s;}
.tech-pill:hover{border-color:var(--red);color:var(--silver2);background:rgba(224,0,15,0.08);}
.tech-pill span{margin-right:8px;}

/* PORTFOLIO */
.portfolio{background:var(--dark2);}
.portfolio-filters{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:50px;}
.filter-btn{background:transparent;border:1px solid rgba(224,0,15,0.2);color:var(--silver);font-family:var(--font-body);font-weight:600;font-size:0.85rem;letter-spacing:1px;padding:8px 20px;cursor:pointer;text-transform:uppercase;transition:all 0.3s;}
.filter-btn.active,.filter-btn:hover{background:var(--red);border-color:var(--red);color:white;}
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;max-width:1200px;margin:0 auto;}
.portfolio-card{position:relative;overflow:hidden;cursor:pointer;background:var(--dark3);border:1px solid rgba(224,0,15,0.1);}
.portfolio-img{width:100%;height:220px;object-fit:cover;display:flex;align-items:center;justify-content:center;transition:transform 0.5s;font-size:4rem;background:linear-gradient(135deg,var(--dark3),var(--dark4));}
.portfolio-card:hover .portfolio-img{transform:scale(1.08);}
.portfolio-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(224,0,15,0.2) 50%,transparent 100%);opacity:0;transition:opacity 0.4s;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;}
.portfolio-card:hover .portfolio-overlay{opacity:1;}
.portfolio-info{padding:20px;}
.portfolio-title{font-family:var(--font-head);font-weight:700;font-size:1.1rem;color:var(--silver2);margin-bottom:6px;}
.portfolio-cat{font-family:var(--font-mono);font-size:0.75rem;color:var(--red);letter-spacing:2px;text-transform:uppercase;}
.portfolio-overlay-text{color:white;font-size:0.9rem;line-height:1.6;}

/* ABOUT */
.about{background:var(--dark);}
.about-inner{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;max-width:1100px;margin:0 auto;}
.about-img-wrap{position:relative;}
.about-img{width:100%;max-width:380px;object-fit:cover;border:2px solid rgba(224,0,15,0.3);position:relative;z-index:2;animation:morphBorder 8s ease-in-out infinite;filter:grayscale(20%);}
.about-img-wrap::before{content:'';position:absolute;top:20px;left:20px;right:-20px;bottom:-20px;border:1px solid rgba(224,0,15,0.2);z-index:1;}
.about-img-wrap::after{content:'';position:absolute;top:-10px;left:-10px;width:80px;height:80px;border-top:3px solid var(--red);border-left:3px solid var(--red);}
.about-text .section-header{text-align:left;margin-bottom:30px;}
.about-text .section-line{margin:20px 0 0;}
.about-desc{color:var(--silver);line-height:1.8;font-size:1rem;margin-top:24px;}
.about-skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}
.skill-chip{background:rgba(224,0,15,0.08);border:1px solid rgba(224,0,15,0.25);color:var(--silver2);font-family:var(--font-mono);font-size:0.75rem;padding:6px 14px;letter-spacing:1px;transition:all 0.3s;}
.skill-chip:hover{background:rgba(224,0,15,0.2);border-color:var(--red);}
.about-info{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.info-item{display:flex;align-items:center;gap:12px;}
.info-icon{color:var(--red);font-size:1.1rem;}
.info-label{font-family:var(--font-mono);font-size:0.75rem;color:var(--silver);display:block;letter-spacing:1px;}
.info-val{font-weight:700;font-size:0.95rem;color:var(--silver2);}

/* PROCESS */
.process{background:var(--dark2);}
.process-steps{display:flex;gap:0;max-width:1100px;margin:0 auto;position:relative;}
.process-steps::before{content:'';position:absolute;top:40px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,var(--red),rgba(224,0,15,0.1));z-index:0;}
.process-step{flex:1;text-align:center;position:relative;z-index:1;padding:0 16px;}
.step-num{width:80px;height:80px;border:2px solid var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-family:var(--font-head);font-size:1.6rem;font-weight:800;color:var(--red);background:var(--dark2);position:relative;transition:all 0.3s;}
.step-num::before{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(224,0,15,0.05);}
.process-step:hover .step-num{background:var(--red);color:white;box-shadow:var(--glow);}
.step-title{font-family:var(--font-head);font-weight:700;font-size:1rem;color:var(--silver2);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
.step-desc{font-size:0.85rem;color:var(--silver);line-height:1.6;}

/* TESTIMONIALS */
.testimonials{background:var(--dark);}
.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;max-width:1100px;margin:0 auto;}
.testi-card{background:var(--dark3);border:1px solid rgba(224,0,15,0.1);padding:32px;position:relative;overflow:hidden;transition:all 0.3s;}
.testi-card::before{content:'"';position:absolute;top:-10px;left:20px;font-size:8rem;color:rgba(224,0,15,0.08);font-family:serif;line-height:1;}
.testi-card:hover{border-color:rgba(224,0,15,0.3);transform:translateY(-4px);}
.testi-stars{color:var(--red);font-size:0.9rem;margin-bottom:16px;letter-spacing:4px;}
.testi-text{font-size:0.95rem;color:var(--silver);line-height:1.8;font-style:italic;margin-bottom:24px;}
.testi-author{display:flex;align-items:center;gap:12px;}
.testi-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),#aa0010);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:white;}
.testi-name{font-weight:700;color:var(--silver2);font-size:0.95rem;}
.testi-role{font-family:var(--font-mono);font-size:0.7rem;color:var(--red);letter-spacing:1px;}

/* CONTACT */
.contact{background:var(--dark2);}
.contact-inner{display:grid;grid-template-columns:1fr 1fr;gap:70px;max-width:1100px;margin:0 auto;}
.contact-info h3{font-family:var(--font-head);font-size:1.8rem;font-weight:700;color:var(--silver2);margin-bottom:16px;}
.contact-info p{color:var(--silver);line-height:1.8;margin-bottom:36px;}
.contact-items{display:flex;flex-direction:column;gap:20px;}
.contact-item{display:flex;align-items:center;gap:16px;}
.contact-icon{width:46px;height:46px;background:rgba(224,0,15,0.1);border:1px solid rgba(224,0,15,0.3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;transition:all 0.3s;}
.contact-item:hover .contact-icon{background:var(--red);box-shadow:var(--glow);}
.contact-label{font-family:var(--font-mono);font-size:0.7rem;color:var(--silver);letter-spacing:2px;text-transform:uppercase;}
.contact-val{font-weight:600;color:var(--silver2);font-size:0.95rem;}
.contact-form{display:flex;flex-direction:column;gap:16px;}
.form-group{display:flex;flex-direction:column;gap:8px;}
.form-label{font-family:var(--font-mono);font-size:0.75rem;color:var(--red);letter-spacing:2px;text-transform:uppercase;}
.form-input,.form-textarea{background:var(--dark3);border:1px solid rgba(224,0,15,0.2);color:var(--silver2);font-family:var(--font-body);font-size:1rem;padding:12px 16px;outline:none;transition:border-color 0.3s;}
.form-input:focus,.form-textarea:focus{border-color:var(--red);box-shadow:0 0 15px rgba(224,0,15,0.1);}
.form-textarea{resize:vertical;min-height:120px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* FOOTER */
.footer{background:var(--dark);border-top:1px solid rgba(224,0,15,0.15);padding:60px 40px 30px;}
.footer-inner{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:50px;max-width:1200px;margin:0 auto;}
.footer-brand img{height:50px;margin-bottom:16px;filter:drop-shadow(0 0 8px rgba(224,0,15,0.4));}
.footer-brand p{color:var(--silver);font-size:0.9rem;line-height:1.7;max-width:280px;}
.footer-col h4{font-family:var(--font-head);font-weight:700;font-size:1rem;color:var(--silver2);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;position:relative;}

// ---- HOOKS ----
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.section-reveal');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    }, {threshold:0.12});
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

function useTyping(words, speed=80, pause=1800) {
  const [text, setText] = useState('');
  const [wi, setWi] = useState(0);
  const [typing, setTyping] = useState(true);
  useEffect(() => {
    const word = words[wi];
    if(typing) {
      if(text.length < word.length) {
        const t = setTimeout(() => setText(word.slice(0,text.length+1)), speed);
        return () => clearTimeout(t);
      } else {
        const t = setTimeout(() => setTyping(false), pause);
        return () => clearTimeout(t);
      }
    } else {
      if(text.length > 0) {
        const t = setTimeout(() => setText(text.slice(0,-1)), speed/2);
        return () => clearTimeout(t);
      } else {
        setWi((wi+1)%words.length);
        setTyping(true);
      }
    }
  },[text,typing,wi]);
  return text;
}

// ---- PARTICLES ----
function Particles() {
  const particles = Array.from({length:16},(_,i)=>({
    id:i,
    left: Math.random()*100+'%',
    delay: Math.random()*8+'s',
    dur: (6+Math.random()*8)+'s',
    size: (2+Math.random()*3)+'px',
  }));

    <div className="hero-particles">

          left:p.left,bottom:0,
          width:p.size,height:p.size,
          animationDelay:p.delay,animationDuration:p.dur
        }}/>
      ))}
    </div>
  );
}

// ---- APP ----
function App() {
  const [page, setPage] = useState('Home');
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 1800); return () => clearTimeout(t); },[]);
  const navigate = (p) => { setPage(p); window.scrollTo({top:0,behavior:'smooth'}); };
  const renderPage = () => {
    switch(page) {
      case 'Home':      return <HomePage setPage={navigate}/>;
      case 'Services':  return <ServicesPage/>;
      case 'Portfolio': return <PortfolioPage/>;
      case 'About':     return <AboutPage/>;
      case 'Contact':   return <ContactPage/>;
      default:          return <HomePage setPage={navigate}/>;
    }
  };
  return (
    <>
      <Loader done={loaded}/>
      <Navbar page={page} setPage={navigate}/>
      <main>{renderPage()}</main>
      <Footer setPage={navigate}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
